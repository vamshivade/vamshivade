<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark futuristic base -->
  <rect width="120" height="120" rx="24" fill="#080808" stroke="#ff6b00" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Outer glowing V -->
  <path d="M30 35 L60 90 L90 35" fill="none" stroke="#ff6b00" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Inner cyber accent line -->
  <path d="M45 45 L60 70 L75 45" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
</svg>